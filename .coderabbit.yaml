# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# AI review on pull requests. Comments are suggestions; a maintainer reviews and merges every change.
language: en-US
tone_instructions: 'Be concise and factual. Point to the line and the rule; skip praise and restating the diff.'
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  path_filters:
    - '!pnpm-lock.yaml'
    - '!CHANGELOG.md'
    - '!.release-please-manifest.json'
    - '!packages/core/data/*.json'
    - '!packages/cli/skills/**'
    - '!**/dist/**'
  path_instructions:
    - path: 'packages/core/src/**'
      instructions: |
        The core library is offline: no network access, no console output (ESLint enforces both).
        Functions return Result objects ({ ok: true, ... } | { ok: false, error: { code, message, hint? } }) instead of throwing on bad input.
        Every Vietnamese fact (bank BINs, codes, prefixes, legal rules, dates) must come from the bundled data or a source cited in a comment; flag any value that looks invented or uncited.
    - path: 'packages/cli/src/**'
      instructions: |
        Commands print JSON when piped or with --json and fail through failExit with a stable error code.
        Each command needs a test in tests/cli.test.ts and must match what skills/*/SKILL.md documents.
    - path: 'packages/mcp/src/**'
      instructions: 'Every tool needs a test in tests/mcp.test.ts. Tool names start with vn_ followed by the skill in snake_case (vn_phone, vn_address_parse).'
    - path: 'skills/**/SKILL.md'
      instructions: |
        Follows the Agent Skills spec: frontmatter name, description, license, compatibility, metadata.
        The description must include Vietnamese and English trigger phrases (checked by tests/golden/triggers.json).
        Commands shown must exist in the CLI with the documented flags and output fields.
    - path: 'tests/**'
      instructions: |
        Pure input-to-output cases belong in tests/golden/<skill>.json (at least 20 per skill).
        A bug fix needs a golden case that fails without the fix.
    - path: 'scripts/build-data.ts'
      instructions: 'Upstream sources are pinned by commit SHA with an MIT/Apache/CC-BY license; SOURCES.md is regenerated, never hand-edited.'
    - path: '.github/workflows/**'
      instructions: 'Least-privilege permissions; no secrets in pull_request jobs from forks.'
  auto_review:
    enabled: true
    drafts: false
    # Release PRs only bump versions and the changelog; dependency bumps are covered by CI.
    ignore_title_keywords:
      - 'chore(release)'
    ignore_usernames:
      - 'dependabot[bot]'
  tools:
    eslint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - CONTRIBUTING.md
  learnings:
    scope: local
