name: Roadmap task
description: A scoped task from ROADMAP.md (usually filed by the roadmap agent).
title: '[RM-000] '
labels: ['status: needs-triage']
body:
  - type: input
    id: roadmap_id
    attributes:
      label: Roadmap ID
      placeholder: RM-012
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist that a reviewer (human or agent) can verify.
      value: |
        - [ ] 
        - [ ] Tests added (≥ 20 cases for a new skill, golden test for a fix)
        - [ ] `pnpm build && pnpm typecheck && pnpm test && pnpm format:check` pass
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files
