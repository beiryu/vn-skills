name: Release

# 1. release-please keeps a "chore(main): release x.y.z" PR open, built from Conventional Commits on main.
#    It bumps the root and all packages/*/package.json versions together and writes CHANGELOG.md.
# 2. Merging that PR creates the vX.Y.Z tag + GitHub Release, and the publish job pushes
#    @vn-skills/core, @vn-skills/cli and @vn-skills/mcp to npm with provenance.
# Requires the NPM_TOKEN secret. workflow_dispatch publishes the current versions (recovery path).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT so the release PR triggers CI (required checks); GITHUB_TOKEN-created PRs don't.
          token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run
      - name: Publish
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
