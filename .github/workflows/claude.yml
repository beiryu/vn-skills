name: Agent · @claude

# Maintainers can mention @claude on issues and PRs (e.g. "@claude address the review comments").

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association) &&
      contains(github.event.comment.body || github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    timeout-minutes: 45
    steps:
      - name: Skip when ANTHROPIC_API_KEY is not configured
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY secret is not set; agent skipped. See AGENTS.md#setup-maintainers"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model ${{ vars.AGENT_IMPLEMENT_MODEL || 'claude-opus-5-5' }}
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue view:*)"
