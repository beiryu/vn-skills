name: Agent · implement

# Picks ONE issue labelled `agent: ready`, implements it on a branch and opens a PR that a human must review.
# Triggers:
#   - a maintainer adds `agent: ready` (labels added by GITHUB_TOKEN don't trigger workflows, hence also:)
#   - schedule: picks the oldest `agent: ready` issue
#   - manual dispatch with an issue number
# Set the AGENT_GITHUB_TOKEN secret (GitHub App or fine-grained PAT: contents, pull-requests, issues = write) so that
# pushes from this workflow trigger CI on the PR. Without it the PR opens but CI must be re-run manually.

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: agent-implement
  cancel-in-progress: false

jobs:
  pick:
    if: >-
      github.event_name != 'issues' || github.event.label.name == 'agent: ready'
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          LABELED_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          issue=""
          if [ "$HAS_ANTHROPIC_KEY" != true ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set; agent skipped. See AGENTS.md#setup-maintainers"
            echo "issue=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$EVENT" in
            issues)
              perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission || echo none)
              if [[ "$perm" =~ ^(admin|maintain|write)$ ]]; then issue="$LABELED_ISSUE"
              else echo "::warning::$SENDER ($perm) may not hand issues to the agent"; fi ;;
            workflow_dispatch) issue="$INPUT_ISSUE" ;;
            schedule)
              issue=$(gh issue list -R "$REPO" --state open --label 'agent: ready' \
                --search 'sort:created-asc -label:"agent: working" -label:"agent: pr-open" -label:"agent: needs-human" -label:"status: blocked"' \
                --limit 1 --json number --jq '.[0].number // empty') ;;
          esac
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "Picked: ${issue:-none}"

  implement:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: agent/issue-${{ needs.pick.outputs.issue }}
    steps:
      - name: Claim issue
        run: |
          gh issue edit "$ISSUE" -R "${{ github.repository }}" --add-label 'agent: working' --remove-label 'agent: ready'

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: |
          git config user.name 'vn-skills-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ vars.AGENT_IMPLEMENT_MODEL || 'claude-opus-5-5' }}
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git log:*),Bash(gh issue view:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
          prompt: |
            Implement issue #${{ needs.pick.outputs.issue }} of ${{ github.repository }}. You are on branch ${{ env.BRANCH }}.
            Follow AGENTS.md ("Implementer" section and "Rules for coding agents") and CONTRIBUTING.md exactly.

            1. `gh issue view ${{ needs.pick.outputs.issue }} --comments`. The issue's acceptance checklist is the spec.
            2. Implement it with tests. Run `pnpm build && pnpm typecheck && pnpm exec vitest run && pnpm format` until green.
            3. Commit with Conventional Commit messages (commitlint runs in CI). Do not push; the workflow pushes.
            4. Write the PR title (one Conventional Commit line) to .agent/pr-title.txt and the PR body to
               .agent/pr-body.md: summary, "Closes #${{ needs.pick.outputs.issue }}", the roadmap ID if any, the
               acceptance checklist with each item ticked or explained, and anything a reviewer should check by hand.
            5. If the issue is ambiguous, needs a decision, network access, credentials or legal judgement, or you cannot
               get tests green: commit nothing, and write the reason to .agent/blocked.md instead.

      - name: Verify
        id: verify
        run: |
          set -euo pipefail
          if [ -f ".agent/blocked.md" ]; then echo "result=blocked" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then echo "result=empty" >> "$GITHUB_OUTPUT"; exit 0; fi
          pnpm build && pnpm typecheck && pnpm exec vitest run && pnpm format:check
          pnpm exec commitlint --from origin/main --to HEAD
          test -s ".agent/pr-title.txt" && head -1 ".agent/pr-title.txt" | pnpm exec commitlint
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.verify.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push -u origin "$BRANCH" --force-with-lease
          url=$(gh pr create --base main --head "$BRANCH" --title "$(head -1 ".agent/pr-title.txt")" \
            --body-file ".agent/pr-body.md" --label 'agent: pr-open')
          gh issue edit "$ISSUE" --add-label 'agent: pr-open' --remove-label 'agent: working'
          gh issue comment "$ISSUE" --body "Opened $url — needs a human review before merge."

      - name: Hand back to a human
        if: failure() || steps.verify.outputs.result == 'blocked' || steps.verify.outputs.result == 'empty'
        run: |
          reason="The agent run did not produce a mergeable change."
          [ -f ".agent/blocked.md" ] && reason=$(cat ".agent/blocked.md")
          gh issue edit "$ISSUE" --add-label 'agent: needs-human' --remove-label 'agent: working'
          printf '%s\n\nRun: %s\n' "$reason" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | gh issue comment "$ISSUE" --body-file -
