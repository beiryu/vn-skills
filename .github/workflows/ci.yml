name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - name: Check bundled data matches pinned upstream commits
        if: matrix.node == 22
        run: pnpm build-data:check
      - name: Format check
        if: matrix.node == 22
        run: pnpm format:check
      - name: Lint
        if: matrix.node == 22
        run: pnpm lint
      - name: Check published package metadata and types
        if: matrix.node == 22
        run: pnpm check:packages
