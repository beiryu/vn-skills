name: Data freshness

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild data from upstream HEAD
        id: check
        continue-on-error: true
        run: pnpm build-data --check --latest 2> >(tee report.txt >&2)
      - name: Open an issue if upstream data changed
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'data: upstream datasets changed since the pinned commits'
        run: |
          if [ -n "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            echo "An open issue already tracks this."
            exit 0
          fi
          {
            echo 'The monthly check rebuilt `packages/core/data` from the latest upstream commits and the output differs from what is committed.'
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo 'Review the upstream changes, bump the pinned SHAs in `scripts/build-data.ts`, run `pnpm build-data` and open a PR.'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh issue create --title "$TITLE" --label 'type: data' --body-file body.md
