# maintainer-bot for this repository (https://github.com/beiryu/maintainer-bot).
# Settings live in .github/maintainer-bot.yml. Secrets: COPILOT_TOKEN (repo secret) and
# MAINTAINER_TOKEN (environment "bot": a fine-grained PAT of the maintainer for this repo only, with
# Contents, Issues and Pull requests read/write). The bot acts as the maintainer: it opens
# issues and PRs under their name, with commits GitHub signs.
name: maintainer-bot

on:
  issues:
    types: [opened, assigned] # assigned to you → implemented. Not `edited`: the bot edits the dashboard
  issue_comment:
    types: [created] # comments on the bot's PRs
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize] # other people's PRs: reviewed from the diff and CI, never run
  schedule:
    - cron: '0 2,8 * * *' # research: web, newcomer tryout, code inspection (09:00 and 15:00 Vietnam)
    - cron: '30 2-13 * * *' # audit: upstream sources + proposals, hourly 09:30–20:30 Vietnam
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [pass, research, audit]
        default: pass

# One pass at a time; a second event waits instead of running alongside.
concurrency:
  group: maintainer-bot
  cancel-in-progress: false

jobs:
  bot:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    # Tracks the bot's v1 tag (same owner as this repo): bot releases apply without a PR here.
    uses: beiryu/maintainer-bot/.github/workflows/agent.yml@v1 # tracks the latest v1.x release
    with:
      # Each schedule is one task; keep these crons in step with the ones above.
      # Different minutes: a run that waits in the concurrency group is replaced by the next one.
      task: ${{ github.event.schedule == '0 2,8 * * *' && 'research' || github.event.schedule == '30 2-13 * * *' && 'audit' || inputs.task || 'pass' }}
      draft_prs: false
    # BOT_PAT lives in the environment "bot", which only the called workflow's publish job
    # enters; inherit is the only way an environment secret reaches a called workflow.
    secrets: inherit
