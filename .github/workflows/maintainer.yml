# maintainer-bot for this repository (https://github.com/beiryu/maintainer-bot).
# Settings live in .github/maintainer-bot.yml. Secrets: MODEL_TOKEN (repo secret) and
# BOT_PAT (environment "bot": a fine-grained PAT of the maintainer for this repo only, with
# Contents, Issues and Pull requests read/write). The bot acts as the maintainer: it opens
# issues and PRs under their name, with commits GitHub signs.
name: maintainer-bot

on:
  issues:
    types: [opened, assigned, edited] # assigned to you → implemented; edited = dashboard ticks
  issue_comment:
    types: [created] # dashboard commands; review comments on the bot's PRs
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize] # other people's PRs: reviewed from the diff and CI, never run
  check_suite:
    types: [completed] # CI failed on a bot PR → a fix is drafted
  schedule:
    - cron: '0 2 * * 1' # weekly: upstream sources + audit
  workflow_dispatch:

# The most GITHUB_TOKEN may do in the called workflow: its agent job reads with these, its
# publish job uses the maintainer's PAT and asks for nothing.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

# One pass at a time; a second event waits instead of running alongside.
concurrency:
  group: maintainer-bot
  cancel-in-progress: false

jobs:
  bot:
    # Pilot: tracks the bot's main branch; pin both to a tag (v1) once settled.
    uses: beiryu/maintainer-bot/.github/workflows/agent.yml@main
    with:
      bot_ref: main
      draft_prs: true # PRs open as drafts; set false once trusted
    secrets: inherit
