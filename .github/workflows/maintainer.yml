# maintainer-bot for this repository (https://github.com/beiryu/maintainer-bot).
# Settings live in .github/maintainer-bot.yml. Secrets: MODEL_TOKEN (repo secret) and
# BOT_PAT (environment "bot": a fine-grained PAT of the maintainer for this repo only, with
# Contents, Issues and Pull requests read/write). The bot acts as the maintainer: it opens
# issues and PRs under their name, with commits GitHub signs.
name: maintainer-bot

on:
  issues:
    types: [opened, assigned, edited] # assigned to you → implemented; edited = dashboard ticks
  issue_comment:
    types: [created] # dashboard commands; review comments on the bot's PRs
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize] # other people's PRs: reviewed from the diff and CI, never run
  check_suite:
    types: [completed] # CI failed on a bot PR → a fix is drafted
  schedule:
    - cron: '0 2 * * *' # daily 09:00 Vietnam: upstream sources + audit
  workflow_dispatch:

# One pass at a time; a second event waits instead of running alongside.
concurrency:
  group: maintainer-bot
  cancel-in-progress: false

jobs:
  bot:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    # Pinned to a commit of the bot: that revision is what runs with the secrets, and its code is
    # checked out at the same commit. Bumped by PR (Dependabot, or by hand) when the bot changes.
    uses: beiryu/maintainer-bot/.github/workflows/agent.yml@45d3283c46a082a9e7e3456caf37a576c624296f # main 2026-10-21
    with:
      draft_prs: true # pilot: PRs open as drafts; set false once trusted
    # BOT_PAT lives in the environment "bot", which only the called workflow's publish job
    # enters; inherit is the only way an environment secret reaches a called workflow.
    secrets: inherit
