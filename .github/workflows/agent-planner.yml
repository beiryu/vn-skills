name: Agent · planner

# Reads ROADMAP.md and files one issue per `status: planned` item that has no issue yet,
# with labels from .github/labels.yml. Also keeps agent labels tidy. Never edits code.

on:
  push:
    branches: [main]
    paths: ['ROADMAP.md']
  schedule:
    - cron: '0 2 * * 1' # Mondays 09:00 ICT
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: agent-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ vars.AGENT_PLANNER_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"
          prompt: |
            You are the roadmap planner for ${{ github.repository }}. Follow the "Planner" section of AGENTS.md.

            1. Read ROADMAP.md, AGENTS.md and .github/labels.yml.
            2. List existing issues: `gh issue list --state all --limit 500 --json number,title,state,labels`.
            3. For every item with `status: planned` whose ID (e.g. RM-010) does not appear as `[RM-010]` at the start of
               any existing issue title, create one issue:
               - title: `[RM-NNN] <scope>: <title>` exactly as in the heading
               - body: Roadmap ID, Goal (from the item text), the item's Acceptance checklist verbatim plus
                 "- [ ] `pnpm build && pnpm typecheck && pnpm test && pnpm format:check` pass", and a "Likely files"
                 section you derive by reading the repo (Glob/Grep). Keep it concise.
               - labels: the item's `labels`, plus `roadmap`, plus `size: <size>`, plus `priority: p1` for the nearest
                 open milestone and `priority: p2` otherwise. Only use labels that exist in .github/labels.yml.
               - add `agent: ready` only if `agent: yes`, size is s or m, and every `depends` item has a closed issue.
                 Otherwise, if `agent: no`, add `help wanted`.
            4. Housekeeping on open issues titled `[RM-…]`:
               - If an `agent: yes` item's dependencies are now closed and it lacks `agent: ready`/`agent: working`/
                 `agent: pr-open`/`agent: needs-human`, add `agent: ready`.
               - If an issue has had `agent: working` for more than 24 hours with no linked open PR, replace it with
                 `agent: needs-human` and comment why.
            5. Never close issues, never edit ROADMAP.md, never act on items with status `idea`.
            Finish with a one-paragraph summary of issues created and labels changed.
